<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet, Just for You</title>
<style>
:root{--bg:#030504;--green:#43ff91;--pink:#ff4f91;--red:#ff3d64;--cream:#ffd6a5;--gold:#ffe99b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f7fff9;font-family:system-ui,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 12%,#0008 100%)}
.ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(20px,4vh,45px) 18px 18px;pointer-events:none}
.kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#9cb5a3}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,5vw,58px);line-height:1.06;margin:14px 0 8px;text-shadow:0 0 22px #ff4f9130}
p{font-size:clamp(12px,1.6vw,15px);line-height:1.65;color:#a8b9ad;max-width:500px;margin:0}
button{pointer-events:auto;cursor:pointer;margin-top:19px;padding:11px 23px;border:1px solid #ff8bb55c;border-radius:28px;background:#210b16b8;color:#ffe8f0;font-size:12px;letter-spacing:.08em;box-shadow:0 0 22px #ff4f9118;transition:.25s}
button:hover{transform:translateY(-2px);background:#421226;box-shadow:0 0 30px #ff4f9140}
.hint{margin-top:auto;padding-top:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#668773}
#again{display:none}
@media(max-height:650px){.ui{padding-top:12px}h1{font-size:clamp(26px,4vw,40px);margin:8px 0}button{margin-top:10px}.hint{padding-top:5px}}
</style>
</head>
<body>
<canvas id="canvas"></canvas><div class="shade"></div>
<div class="ui">
 <div class="kicker">somethingggggg madeeeeee justtttt for you <3 </div>
 <h1 id="title">little bouquettt<br>forrr yaa🌹</h1>
 <p id="caption"><br></p>
 <button id="start">Make the roses bloom ✦</button>
 <button id="again">One more time ↻</button>
 <div class="hint" id="hint">stay for the final bloom</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,started=false,finished=false,raf=0,roses=[],leaves=[],particles=[],t0=0;
const roseColors=['#ff315f','#ff6ca6','#e94282','#ff8b9d','#c85cff','#ff425b','#ffb0c9'];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!started)ground()}
addEventListener('resize',resize);
function ground(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,'#03050400');g.addColorStop(1,'#06130b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){ctx.fillStyle=`rgba(157,255,192,${.05+(i%4)*.025})`;ctx.fillRect(i*W/65,H*.86+Math.sin(i)*3,2,1)}}
resize();
function cubic(s,t){let m=1-t;return{x:m*m*m*s.x+3*m*m*t*s.c1x+3*m*t*t*s.c2x+t*t*t*s.tx,y:m*m*m*s.y+3*m*m*t*s.c1y+3*m*t*t*s.c2y+t*t*t*s.ty}}
function stroke(points,color,width,alpha=1){if(points.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.globalAlpha=alpha*.22;ctx.strokeStyle=color;ctx.lineWidth=width*4;ctx.shadowColor=color;ctx.shadowBlur=22;ctx.stroke();ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowBlur=12;ctx.stroke();ctx.globalAlpha=alpha*.9;ctx.strokeStyle='#eafff0';ctx.lineWidth=Math.max(.5,width*.2);ctx.stroke();ctx.restore()}
function pathPoints(s,progress){let pts=[];for(let i=0;i<=50;i++)pts.push(cubic(s,progress*i/50));return pts}
function setup(){
 roses=[];leaves=[];particles=[];
 const n=7,baseY=H*.82,center=W/2;
 for(let i=0;i<n;i++){
   const spread=(i-(n-1)/2),x=center+spread*Math.min(W*.052,42),height=H*(.27+(i%3)*.055),lean=spread*W*.012;
   const stem={x:center+spread*4,y:baseY,tx:x+lean,ty:baseY-height,c1x:center+spread*9,c1y:baseY-height*.35,c2x:x+lean*.3,c2y:baseY-height*.7,p:0,speed:.006+(i%3)*.0008,color:'#43ff91',done:false};
   roses.push({stem,x:x+lean,y:baseY-height,r:Math.min(33,Math.max(20,W*.025)),color:roseColors[i],p:0,seed:i*1.7,done:false});
   for(let j=0;j<3;j++){let q=.28+j*.17,pt=cubic({...stem,tx:stem.tx,ty:stem.ty},q),side=(j%2?1:-1),len=H*(.045+j*.009);
     leaves.push({x:pt.x,y:pt.y,tx:pt.x+side*len,ty:pt.y-len*.26,c1x:pt.x+side*len*.2,c1y:pt.y-len*.08,c2x:pt.x+side*len*.8,c2y:pt.y-len*.22,p:0,speed:.013,done:false});
   }
 }
}
function drawStem(s){stroke(pathPoints({x:s.x,y:s.y,c1x:s.c1x,c1y:s.c1y,c2x:s.c2x,c2y:s.c2y,tx:s.tx,ty:s.ty},s.p),s.color,2)}
function drawLeaf(l){stroke(pathPoints(l,l.p), '#43ff91',1.5,.95);if(l.p>.75){let p=cubic(l,Math.min(1,l.p));stroke([{x:l.x,y:l.y},{x:p.x,y:p.y}],'#b8ffd0',.6,.7)}}
function petalPath(a,r,pr,offset){let pts=[];for(let j=0;j<=34;j++){let t=pr*j/34;let rr=r*(.15+.85*Math.sin(Math.PI*t*.92));let ang=a+offset+t*1.3;pts.push({x:Math.cos(ang)*rr,y:Math.sin(ang)*rr*.72-r*.24*t})}return pts}
function drawRose(b,progress){
 const {x,y,r,color,seed}=b;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(seed)*.09);
 // outer silhouette: individual curled petals trace in sequence
 const layers=[{n:5,scale:1,a:.95},{n:6,scale:.72,a:.7},{n:5,scale:.45,a:.42}];
 let total=0;
 layers.forEach((layer,li)=>{for(let i=0;i<layer.n;i++){
   let local=progress*layers.reduce((sum,l)=>sum+l.n,0)-total;
   total++;
   let p=Math.max(0,Math.min(1,local*.9));if(p<=0)continue;
   const angle=i*Math.PI*2/layer.n+li*.34+seed;
   stroke(petalPath(angle,r*layer.scale,p,li*.12),color,1.6,.98);
 }});
 // inner rose spiral appears after outer petals
 const inner=Math.max(0,(progress-.58)/.42);
 if(inner>0){let pts=[];for(let i=0;i<=100;i++){let a=i/100*Math.PI*4.5,rad=r*.035+(r*.24*inner)*(i/100);pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad*.72})}stroke(pts,'#ffd8e7',1.25,inner)}
 if(progress>.9){ctx.beginPath();ctx.arc(0,0,r*.07,0,Math.PI*2);ctx.fillStyle='#ffe6a3';ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fill()}
 ctx.restore();
}
function sparkle(x,y,color){for(let i=0;i<2;i++)particles.push({x,y,vx:(Math.random()-.5)*1.1,vy:(Math.random()-.5)*1.1,life:1,color})}
function drawRibbon(){
 // two curved ribbon tails and a glowing bow at bouquet's tie
 let x=W/2,y=H*.76;
 stroke([{x:x-9,y:y},{x:x-26,y:y+H*.05},{x:x-33,y:y+H*.095}],'#ff7cae',1.5,.9);
 stroke([{x:x+9,y:y},{x:x+24,y:y+H*.045},{x:x+35,y:y+H*.085}],'#ff7cae',1.5,.9);
 stroke([{x:x,y:y},{x:x-17,y:y-8},{x:x-22,y:y-17},{x:x-5,y:y-13},{x:x,y:y}],'#ff7cae',1.5,.95);
 stroke([{x:x,y:y},{x:x+17,y:y-8},{x:x+22,y:y-17},{x:x+5,y:y-13},{x:x,y:y}],'#ff7cae',1.5,.95);
}
function frame(){raf=requestAnimationFrame(frame);if(!started)return;ground();let all=true;
 roses.forEach(b=>{if(!b.stem.done){b.stem.p=Math.min(1,b.stem.p+b.stem.speed);if(b.stem.p>=1)b.stem.done=true;else all=false}drawStem(b.stem);
 if(b.stem.p>.92&&!b.done){b.p=Math.min(1,b.p+.012);if(b.p>=1)b.done=true;else all=false}else if(!b.done)all=false;
 if(b.p>0){drawRose(b,b.p);if(b.p>.15&&Math.random()<.13)sparkle(b.x,b.y,b.color)}});
 leaves.forEach(l=>{if(!l.done){l.p=Math.min(1,l.p+l.speed);if(l.p>=1)l.done=true;else all=false}drawLeaf(l)});
 particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.022;ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fillRect(p.x,p.y,2,2);ctx.restore()});
 if(roses.every(b=>b.done)&&leaves.every(l=>l.done)&&!finished){finished=true;drawRibbon();document.getElementById('title').innerHTML='A bouquetttttt, madeeeee<br>juusssst forrrr yaaaaaa <3';document.getElementById('caption').innerHTML='<br>';document.getElementById('hint').textContent='every rose, drawn one line at a time';document.getElementById('again').style.display='inline-block'}
}
function start(){started=true;finished=false;setup();document.getElementById('start').style.display='none';document.getElementById('again').style.display='none';document.getElementById('title').textContent='Watch the roses bloom.';document.getElementById('caption').textContent='';document.getElementById('hint').textContent='growing your bouquet...';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
document.getElementById('start').onclick=start;
document.getElementById('again').onclick=()=>{document.getElementById('title').innerHTML='A little bouquet<br>for you. 🌹';document.getElementById('caption').innerHTML="<br>";document.getElementById('hint').textContent='stay for the final bloom';start()};
</script>
</body></html>
